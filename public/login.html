<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.2), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(16, 185, 129, 0.16), transparent 55%),
                #f5f6fb;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #111827;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(245, 246, 251, 0.92));
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .login-box {
            position: relative;
            background: rgba(255, 255, 255, 0.92);
            padding: var(--space-xl);
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            backdrop-filter: blur(16px);
            overflow: hidden;
            animation: login-fade 600ms ease both;
        }

        .login-box::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(140deg, rgba(99, 102, 241, 0.2), transparent 45%, rgba(16, 185, 129, 0.14));
            opacity: 0.8;
            pointer-events: none;
        }

        .login-logo {
            display: none;
        }

        .login-logo .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-md);
            color: var(--color-accent);
            filter: drop-shadow(0 8px 20px rgba(99, 102, 241, 0.35));
        }

        .login-logo h1 {
            font-family: 'Century Gothic', sans-serif;
            font-size: 28px;
            font-weight: 500;
            color: #0f172a;
            margin: 0;
        }

        .login-logo .brand-accent {
            color: var(--color-accent);
        }

        .login-logo p {
            color: #475569;
            margin: var(--space-sm) 0 0 0;
            font-size: 14px;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-md);
        }

        .form-group {
            margin-bottom: 0;
            width: 100%;
            max-width: 320px;
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-sm);
            color: #334155;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            color: #0f172a;
            font-size: 15px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .btn-login {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            background: #0ea5a4;
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #0f918f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1f2937;
        }

        .btn-secondary:hover {
            background: #cbd5f5;
            color: #0f172a;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .setup-message {
            background: rgba(99, 102, 241, 0.1);
            color: #4338ca;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-size: 14px;
            display: none;
        }

        .setup-message.show {
            display: block;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .modal.show {
            display: flex;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
        }

        .modal-card {
            position: relative;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            width: min(420px, 92vw);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
            border: 1px solid rgba(148, 163, 184, 0.3);
            z-index: 1;
        }

        .modal-card h3 {
            margin: 0 0 var(--space-sm) 0;
            font-size: 18px;
            color: #0f172a;
        }

        .modal-card p {
            margin: 0 0 var(--space-lg) 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: var(--space-sm);
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .sso-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .sso-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
            z-index: 0;
        }

        .sso-divider span {
            background: rgba(255, 255, 255, 0.92);
            padding: 0 12px;
            color: #64748b;
            font-size: 13px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.08em;
        }

        .btn-sso {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-sso:hover {
            background: #f1f5f9;
            border-color: #6366f1;
            color: #4338ca;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        @keyframes login-fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo"></div>

            <div class="error-message" id="error-message"></div>
            <div class="setup-message" id="setup-message">
                Welcome! Please create your admin account to get started.
            </div>

            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Enter your username" aria-label="Username">
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        minlength="6" placeholder="Enter your password" aria-label="Password">
                </div>

                <button type="submit" class="btn-login" id="submit-btn">Sign In</button>
            </form>

        </div>
    </div>

    <div class="modal" id="active-session-modal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="active-session-title">
            <h3 id="active-session-title">Aktive Sitzung erkannt</h3>
            <p>Du bist bereits auf einem anderen Gerät eingeloggt. Möchtest du die bestehende Sitzung beenden und dich trotzdem einloggen?</p>
            <div class="modal-actions">
                <button type="button" class="btn-login btn-secondary" id="active-session-cancel">Abbrechen</button>
                <button type="button" class="btn-login" id="active-session-force">Trotzdem einloggen</button>
            </div>
        </div>
    </div>

    <script>
        // Check for URL Error params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = error;
            errorMessage.classList.add('show');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Check if setup is required
        let isSetupMode = false;

        async function checkSetupRequired() {
            try {
                const response = await fetch('/api/auth/setup-required');
                const data = await response.json();

                if (data.setupRequired) {
                    isSetupMode = true;
                    document.getElementById('login-subtitle').textContent = 'Create Admin Account';
                    document.getElementById('submit-btn').textContent = 'Create Account';
                    document.getElementById('setup-message').classList.add('show');
                    document.getElementById('password').placeholder = 'Minimum 6 characters';
                    // Hide SSO in setup mode
                    document.querySelector('.sso-divider').style.display = 'none';
                    document.getElementById('btn-sso-login').style.display = 'none';
                }
            } catch (err) {
                console.error('Error checking setup status:', err);
            }
        }

        const activeSessionModal = document.getElementById('active-session-modal');
        const activeSessionCancel = document.getElementById('active-session-cancel');
        const activeSessionForce = document.getElementById('active-session-force');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        function showActiveSessionModal() {
            activeSessionModal.classList.add('show');
            activeSessionModal.setAttribute('aria-hidden', 'false');
        }

        function hideActiveSessionModal() {
            activeSessionModal.classList.remove('show');
            activeSessionModal.setAttribute('aria-hidden', 'true');
        }

        function resetSubmitButton() {
            submitBtn.disabled = false;
            submitBtn.textContent = isSetupMode ? 'Create Account' : 'Sign In';
        }

        async function attemptLogin(forceLogin = false) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';

            try {
                const endpoint = isSetupMode ? '/api/auth/setup' : '/api/auth/login';
                const payload = { username, password };
                if (!isSetupMode && forceLogin) {
                    payload.forceLogin = true;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    if (!isSetupMode && response.status === 409 && data.code === 'ACTIVE_SESSION') {
                        showActiveSessionModal();
                        resetSubmitButton();
                        return;
                    }
                    throw new Error(data.error || 'Authentication failed');
                }

                // Store token
                localStorage.setItem('authToken', data.token);

                // Redirect to main app (replace history to prevent back button issues)
                window.location.replace('/');
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('show');
                resetSubmitButton();
            }
        }

        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await attemptLogin(false);
        });

        activeSessionCancel.addEventListener('click', () => {
            hideActiveSessionModal();
        });

        activeSessionForce.addEventListener('click', async () => {
            hideActiveSessionModal();
            await attemptLogin(true);
        });

        // Check setup status on load
        checkSetupRequired();
    </script>
</body>

</html>
